name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx wrangler dev --env verification --port 8787 > /tmp/traffic-server.log 2>&1 &
        env:
          WRANGLER_SEND_METRICS: false
      - run: node scripts/private-fixture.mjs
      - run: npx wrangler dev --env privatecheck --port 8788 > /tmp/traffic-private-server.log 2>&1 &
        env:
          WRANGLER_SEND_METRICS: false
      - run: |
          private_ready=false
          for attempt in $(seq 1 60); do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8788/plan)" = "401" ]; then private_ready=true; break; fi
            sleep 1
          done
          if [ "$private_ready" != true ]; then cat /tmp/traffic-private-server.log; exit 1; fi
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/api/health; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/traffic-server.log; exit 1; fi
          npm run test:e2e
        env:
          TEST_BASE_URL: http://127.0.0.1:8787
          PRIVATE_TEST_BASE_URL: http://127.0.0.1:8788
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: |
            playwright-report/
            test-results/
          retention-days: 7
