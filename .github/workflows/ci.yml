name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run api:dev > /tmp/traffic-server.log 2>&1 &
        env:
          WRANGLER_SEND_METRICS: false
      - run: |
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/api/health; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/traffic-server.log; exit 1; fi
          npm run test:e2e
        env:
          TEST_BASE_URL: http://127.0.0.1:8787
